app-id: org.artcraft.app
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: app
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
modules:
  - name: app
    buildsystem: simple
    build-commands:
      - cargo build --release
      - install -Dm755 target/release/app /app/bin/app
    sources:
      - type: dir
        path: .
