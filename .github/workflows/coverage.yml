name: Test Coverage & Verification Gate

on:
  push:
    branches: [ main, feat/* ]
  pull_request:
    branches: [ main ]

jobs:
  coverage:
    name: 100% Test Coverage Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install llvm-cov and nextest
        run: |
          cargo install cargo-llvm-cov
          cargo install cargo-nextest
      - name: Run Unit, Integration, and Property Tests
        run: cargo llvm-cov --all-features --workspace --lcov --output-path lcov.info
      - name: Enforce Strict Coverage Threshold
        run: cargo llvm-cov --all-features --workspace --fail-under-lines 95
