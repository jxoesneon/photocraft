name: Multi-Platform Release Packaging

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write
  packages: write

jobs:
  # 1. Linux Packaging (.deb, .rpm, .flatpak via cargo-generate-rpm & cargo-deb)
  package-linux:
    name: Linux (${{ matrix.target.arch }} / ${{ matrix.target.format }})
    runs-on: ${{ matrix.target.runner }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - { arch: x86_64, triple: x86_64-unknown-linux-gnu, format: deb, runner: ubuntu-latest }
          - { arch: x86_64, triple: x86_64-unknown-linux-gnu, format: rpm, runner: ubuntu-latest }
          - { arch: aarch64, triple: aarch64-unknown-linux-gnu, format: deb, runner: ubuntu-24.04-arm }
          - { arch: aarch64, triple: aarch64-unknown-linux-gnu, format: rpm, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target.triple }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-generate-rpm
      - name: Install native build deps
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Build and Package
        run: |
          if [ "${{ matrix.target.format }}" = "deb" ]; then
            cargo deb -p photocraft --target ${{ matrix.target.triple }}
          else
            cargo build --release -p photocraft --target ${{ matrix.target.triple }}
            ln -s apps/photocraft photocraft || true
            cargo generate-rpm -p photocraft --target ${{ matrix.target.triple }}
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.target.arch }}-${{ matrix.target.format }}
          path: target/${{ matrix.target.triple }}/*/*.${{ matrix.target.format }}

  # Flatpak Container Sandbox Build
  package-flatpak:
    name: Linux Flatpak (x86_64 & aarch64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install flatpak-builder
        run: |
          sudo apt-get update && sudo apt-get install -y flatpak flatpak-builder
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y flathub org.freedesktop.Sdk//25.08 org.freedesktop.Platform//25.08 org.freedesktop.Sdk.Extension.rust-stable//25.08
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: true
          manifest-path: packaging/flatpak/org.artcraft.app.yml
          run-tests: false
      - uses: actions/upload-artifact@v4
        with:
          name: linux-flatpak
          path: '*.flatpak'

  # 2. macOS Packaging (.dmg, Universal / Apple Silicon + Intel)
  package-macos:
    name: macOS (Universal .dmg)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-bundle
      - name: Compile and Lipo Universal Binary
        run: |
          cargo build --release -p photocraft --target aarch64-apple-darwin
          cargo build --release -p photocraft --target x86_64-apple-darwin
          mkdir -p target/universal-apple-darwin/release
          lipo -create             target/aarch64-apple-darwin/release/photocraft             target/x86_64-apple-darwin/release/photocraft             -output target/universal-apple-darwin/release/photocraft
      - name: Create DMG
        run: hdiutil create -volname "ArtCraft App" -srcfolder target/universal-apple-darwin/release -ov -format UDZO app.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: macos-universal-dmg
          path: app.dmg

  # 3. Windows Packaging (.exe / .msi across x64 and ARM64)
  package-windows:
    name: Windows (${{ matrix.target.arch }})
    runs-on: windows-latest
    strategy:
      matrix:
        target:
          - { arch: x64, triple: x86_64-pc-windows-msvc }
          - { arch: arm64, triple: aarch64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target.triple }}
      - name: Install WiX v5
        run: dotnet tool install --global wix --version 5.0.2
      - name: Compile and Build Windows MSI
        run: pwsh packaging/windows/package.ps1 -Arch ${{ matrix.target.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.target.arch }}-installer
          path: dist/release/*
