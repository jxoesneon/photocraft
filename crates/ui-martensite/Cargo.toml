[package]
name = "photocraft-ui-martensite"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Sovereign retained-mode, GPU-accelerated graphical user interface for PhotoCraft powered by Martensite"

[dependencies]
photocraft-engine = { path = "../engine" }
photocraft-doc = { path = "../doc" }
photocraft-geom = { path = "../geom" }
photocraft-color = { path = "../color" }
photocraft-cms = { path = "../cms" }
photocraft-io = { path = "../io" }

# `vello` turns the orchestrator's GPU path on — without it frames present empty.
martensite = { version = "0.21", features = ["vello"] }
winit = "0.31.0-beta.3"
pollster = "1.0"
glam = "0.33"
kurbo = "0.13"
log.workspace = true

serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tracing.workspace = true

[dev-dependencies]
proptest = "1.4"
